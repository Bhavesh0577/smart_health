version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: phc_timescaledb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_health
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: phc_ml_service
    restart: always
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgrespassword@timescaledb:5432/smart_health
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phc_web
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgrespassword@timescaledb:5432/smart_health
      - ML_SERVICE_URL=http://ml-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "3000:8080"
    depends_on:
      - timescaledb
      - ml-service

volumes:
  timescale_data:
